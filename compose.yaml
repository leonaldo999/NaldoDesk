services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    environment:
      APP_NAME: ${APP_NAME:?Copia .env.docker.example a .env.docker y define APP_NAME}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env.docker}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:?Define POSTGRES_DB en .env.docker}
      DB_USERNAME: ${POSTGRES_USER:?Define POSTGRES_USER en .env.docker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.docker}
      SESSION_DRIVER: database
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?Define SANCTUM_STATEFUL_DOMAINS en .env.docker}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Define CORS_ALLOWED_ORIGINS en .env.docker}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "null"
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-1}
      REALTIME_ENABLED: ${REALTIME_ENABLED:-true}
      REALTIME_EVENT_CHANNEL: ${REALTIME_EVENT_CHANNEL:-naldo:events}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - laravel_storage:/var/www/html/storage
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nginx
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_started
    volumes:
      - laravel_storage:/var/www/html/storage:ro
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      LISTEN_HOST: 0.0.0.0
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Define FRONTEND_ORIGINS en .env.docker}
      LARAVEL_INTERNAL_URL: http://nginx
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      REALTIME_EVENT_CHANNEL: ${REALTIME_EVENT_CHANNEL:-naldo:events}
      SESSION_REVALIDATION_INTERVAL_MS: ${SESSION_REVALIDATION_INTERVAL_MS:-60000}
    depends_on:
      redis:
        condition: service_healthy
      nginx:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/socket.io/?EIO=4&transport=polling', { headers: { origin: 'http://localhost:8080' } }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tests
    environment:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_INTEGRATION_TESTS: "true"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  laravel_storage:
